<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Tutu Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            Tutu Store
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>

    </nav>


    <!-- Register Section -->
    <section class="auth-section">

        <div class="auth-container">

            <h1>Create Account</h1>

            <form id="register-form">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit">
                    Register
                </button>

            </form>


            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Tutu Store | 3-Tier AWS E-Commerce Project
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>
</html>
