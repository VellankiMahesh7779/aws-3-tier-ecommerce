<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutu Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- Navigation Bar -->
    <header>

        <nav class="navbar">

            <div class="logo">
                Tutu Store
            </div>


            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="products.html">
                        Products
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart
                    </a>
                </li>

                <li>
                    <a href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>



    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>
                Welcome to Tutu Store
            </h1>

            <p>
                Your one-stop online store for quality products.
            </p>

            <a href="products.html" class="btn">
                Shop Now
            </a>

        </div>

    </section>



    <!-- Featured Products -->
    <section class="featured">

        <h2>
            Featured Products
        </h2>


        <!--
            Products will be loaded dynamically
            from Flask API using main.js
        -->
        <div
            class="product-container"
            id="featured-products">

        </div>

    </section>



    <!-- Footer -->
    <footer>

        <p>
            © 2026 Tutu Store. All rights reserved.
        </p>

    </footer>



    <!-- Main JavaScript -->
    <script src="js/main.js"></script>


</body>

</html>
